name: Build Spider Jar

on:
  push:
    paths:
      - 'spider/**'
      - '.github/workflows/build-spider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android build-tools (d8)
        run: |
          set -e
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          echo "$HOME/android-sdk/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build maccms-spider.jar
        run: bash spider/build.sh

      - name: Commit built jar
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jar/maccms-spider.jar
          if git diff --cached --quiet; then
            echo "jar 无变化，跳过提交"
          else
            git commit -m "chore: 自动构建 maccms-spider.jar"
            git push
          fi
