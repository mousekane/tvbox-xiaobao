name: Build Spider Jar

on:
  push:
    paths:
      - 'spider/**'
      - '.github/workflows/build-spider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build maccms-spider.jar
        run: bash spider/build.sh

      - name: Commit built jar
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jar/maccms-spider.jar
          if git diff --cached --quiet; then
            echo "jar 无变化，跳过提交"
          else
            git commit -m "chore: 自动构建 maccms-spider.jar"
            git push
          fi
